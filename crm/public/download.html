<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحميل Paraveda CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:40px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);display:grid;place-items:center;font-size:34px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(99,102,241,.4)}
h1{font-size:22px;color:#1e293b;margin-bottom:6px}
p{font-size:13px;color:#64748b;line-height:1.8;margin-bottom:24px}
a.btn{display:block;background:linear-gradient(135deg,#059669,#10b981);color:#fff;text-decoration:none;font-size:18px;font-weight:800;padding:18px;border-radius:16px;box-shadow:0 10px 30px rgba(16,185,129,.45);transition:.2s}
a.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(16,185,129,.55)}
.meta{margin-top:18px;font-size:11px;color:#94a3b8}
.steps{margin-top:20px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px;text-align:right;font-size:12px;color:#475569;line-height:2}
b{color:#0f172a}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📊</div>
  <h1>Paraveda CRM</h1>
  <p>آخر نسخة كاملة — كل الميزات (ف1.8+)</p>
  <a class="btn" href="/CRM.html" download="CRM.html">⬇️ حمّل CRM.html دابا</a>
  <div class="meta">الحجم: ~1 MB · ملف واحد · v1.8+ · بالدرهم 🇲🇦</div>
  <div class="steps">
    <b>طريقة الرفع للاستضافة:</b><br>
    1️⃣ حمّل الملف من الزر فوق<br>
    2️⃣ Hostinger → File Manager → public_html<br>
    3️⃣ Upload → اختار CRM.html<br>
    4️⃣ زور: الموقع-ديالك.ma/CRM.html ✅
  </div>
</div>
</body>
</html>
